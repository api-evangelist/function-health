description: >-
  FinOps view of Function Health spend. Function Health is a consumer membership
  product, not a usage-metered API, so there is no per-call or per-token billing
  to manage. Cost is a flat annual subscription per member plus optional
  clinical add-ons (MRI, CT, Galleri, etc.). There are no API meters, usage
  exports, or FOCUS-aligned billing dimensions because no public API is offered.
  This artifact is unreconciled at the API level and documents the consumer
  billing model only.
notes: >-
  Membership pricing has changed over time (previously $499/year, with a promoted
  $365/year rate) and add-on pricing is quoted in-product. If a developer or
  partner API with usage-based billing is launched, reconcile this artifact with
  real meters and FOCUS columns. Verify current consumer pricing at
  functionhealth.com/pricing.
