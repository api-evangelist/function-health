- name: annual_membership
  description: Flat annual consumer membership fee per member.
  unit: subscription
  aggregation: sum
  dimensions:
  - member
- name: clinical_add_ons
  description: Optional advanced clinical tests (MRI, CT, Galleri, etc.) billed per add-on.
  unit: tests
  aggregation: sum
  dimensions:
  - member
  - add_on
principles:
- name: Visibility
  description: Track membership renewal cost and any add-on purchases per member; no API usage exports exist.
- name: Allocation
  description: Attribute the flat membership and add-on costs to the individual member or HSA/FSA account.
- name: Optimization
  description: Use promotional discount codes and HSA/FSA pre-tax eligibility to reduce effective membership cost; add only clinically warranted add-ons.
- name: Accountability
  description: Review renewal annually against perceived value; there is no metered API spend to govern.
