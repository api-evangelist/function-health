  description: Member-initiated PDF export of lab results from the documents area of
    the dashboard. This is a manual download for data portability, not a
    programmatic API; third-party trackers import the resulting PDF.
- aid: function-health:function-health-connected-apps
  name: Function Health Connected Apps
  tags:
