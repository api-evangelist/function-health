  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.functionhealth.com
  properties:
  - url: https://clpmag.com/lab-essentials/information-technology/function-health-integrates-lab-data-chatgpt-app/
    type: Documentation
  - url: openapi/function-health-openapi.yml
    type: OpenAPI
  description: An opt-in app within ChatGPT through which a member can authorize
    secure access to a limited, high-level summary of their lab results, with the
    ability to revoke access at any time. Surfaced through the ChatGPT app ecosystem;
    Function does not document a standalone public API for it.
