  - Wearables
  - Connected Apps
  - Data Sync
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.functionhealth.com/faqs/does-function-integrate-with-oura-fitbit-apple-health-or-other-health-services
  properties:
  - url: https://www.functionhealth.com/faqs/does-function-integrate-with-oura-fitbit-apple-health-or-other-health-services
    type: Documentation
  - url: openapi/function-health-openapi.yml
    type: OpenAPI
  description: In-product Connected Apps let members link supported consumer health
    services (e.g. wearables and Apple Health) to sync data into Function. These are
    pre-built, member-authorized integrations configured in the app, not a developer
    API that third parties can build against.
