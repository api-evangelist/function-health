aid: function-health
url: https://raw.githubusercontent.com/api-evangelist/function-health/refs/heads/main/apis.yml
name: Function Health
kind: company
description: Function Health is a consumer longevity and preventive-health membership
  that runs 100+ lab biomarkers twice a year through Quest Diagnostics, adds clinician
  review, a biological age calculation, and an AI health companion via a web and mobile
  dashboard. As of this catalog Function Health does not publish a public or partner
  developer API; member data is accessed through the member dashboard, PDF export,
  in-product Connected Apps (wearable sync), and an opt-in ChatGPT app that shares a
  high-level summary of results.
